<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狼人殺-終極旗艦版</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #eee; margin: 0; padding: 10px; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 15px; background: #1e1e1e; }
        button { padding: 12px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; margin: 5px; font-weight: bold; width: 85%; }
        .btn-disabled { background: #444 !important; color: #888 !important; cursor: not-allowed; opacity: 0.5; }
        #nightOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        #hostControl { display: none; border: 2px solid #03dac6; z-index: 3000; position: relative; background: #1e1e1e; padding: 10px; }
        #roomTitle { color: #f1c40f; font-size: 1.5em; font-weight: bold; }
        .status-dead { opacity: 0.4; pointer-events: none; }
        .dead-text { color: #cf6679; font-weight: bold; }
    </style>
</head>
<body>

<div id="setupArea">
    <div class="box">
        <input type="text" id="hName" placeholder="法官暱稱" style="width:80%; padding:10px; border-radius:5px; border:none;">
        <button onclick="myName=document.getElementById('hName').value; socket.emit('createRoom');" style="background:#cf6679; color:white; margin-top:10px;">建立房間</button>
    </div>
    <div class="box">
        <input type="text" id="pName" placeholder="玩家暱稱" style="width:80%; padding:10px; border-radius:5px; border:none;"><br>
        <input type="text" id="rCode" placeholder="房號" style="width:80%; padding:10px; margin-top:5px; border-radius:5px; border:none;">
        <button onclick="myName=document.getElementById('pName').value; currentRoom=document.getElementById('rCode').value; socket.emit('joinRoom',{roomCode:currentRoom,playerName:myName});" style="background:#03dac6; color:black; margin-top:10px;">加入房間</button>
    </div>
</div>

<div id="gameArea" style="display:none;">
    <div class="box">
        <div id="roomTitle">房號: --</div>
        <div id="playerListText" style="color:#f1c40f; margin-top:5px;"></div>
    </div>
    <div class="box" id="myRoleBox">
        <div id="showBtn" style="background:#333; padding:20px; border-radius:10px; user-select:none;">長按查看身分</div>
        <div id="roleDisplay" style="display:none; font-size:30px; color:#bb86fc; font-weight:bold; margin-top:10px;"></div>
        <p id="aliveStatus" style="color:#4caf50; margin-top:10px;">狀態：存活</p>
    </div>
    <div id="hostControl">
        <p style="color:#03dac6; margin-bottom:5px;">法官控制台</p>
        <button onclick="if(confirm('重啟遊戲？')) socket.emit('startGame', currentRoom)" style="background:#4caf50; color:white;">開始/重新開局</button>
        <div style="display:flex; justify-content:center;">
            <button style="width:45%; background:#333; color:white;" onclick="changePhase('night')">🌙 天黑</button>
            <button style="width:45%; background:#333; color:white;" onclick="changePhase('day')">☀️ 天亮</button>
        </div>
        <div id="adminLog" style="text-align:left; color:#ffb74d; font-size:12px; margin-top:10px; border-top:1px solid #444; padding-top:5px;">紀錄：</div>
        <div id="killList"></div>
    </div>
</div>

<div id="nightOverlay">
    <h2 id="nightTitle">🌙 天黑請閉眼</h2>
    <div id="actionUI" style="display:none; width:100%;">
        <h3 id="actionMsg" style="color:#cf6679;">請行動</h3>
        <div id="actionBtns"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myName, myRole, currentRoom, isHost=false, alive=true;
    let witchPotions={save:true, poison:true}, alivePlayers=[], lastGuardedByMe="";

    socket.on('roomCreated', code => {
        currentRoom = code; isHost = true;
        document.getElementById('roomTitle').innerText = "房號: " + code;
        document.getElementById('setupArea').style.display = "none";
        document.getElementById('gameArea').style.display = "block";
        document.getElementById('hostControl').style.display = "block";
        socket.emit('joinRoom', { roomCode: code, playerName: myName });
    });
// 當伺服器確認你是法官時，強制打開面板
    socket.on('hostCheck', data => {
        if (data.isHost) {
            isHost = true;
            document.getElementById('hostControl').style.display = "block";
        }
    });
    socket.on('roomUpdated', players => {
        document.getElementById('setupArea').style.display = "none";
        document.getElementById('gameArea').style.display = "block";
        document.getElementById('playerListText').innerText = players.map(p => (p.alive?"👤 ":"💀 ")+p.name).join(', ');
        if(isHost){
            const kl = document.getElementById('killList'); kl.innerHTML = "<p style='margin:5px'>宣告死亡:</p>";
            players.forEach(p => { if(p.alive){
                const b = document.createElement('button'); b.innerText = p.name; b.style.width="30%"; b.style.display="inline-block";
                b.onclick = () => { if(confirm('確定宣告 '+p.name+' 死亡？')) socket.emit('killPlayer', {roomCode:currentRoom, targetName:p.name}); };
                kl.appendChild(b);
            }});
        }
    });

    socket.on('assignRole', data => { 
        myRole=data.role; alive=true; lastGuardedByMe="";
        document.getElementById('roleDisplay').innerText=myRole;
        document.getElementById('aliveStatus').innerText="狀態：存活";
        document.getElementById('aliveStatus').className="";
        document.getElementById('myRoleBox').classList.remove('status-dead');
    });

    socket.on('youAreDead', () => { 
        alive = false; 
        document.getElementById('aliveStatus').innerText="狀態：已出局";
        document.getElementById('aliveStatus').className="dead-text";
        document.getElementById('myRoleBox').classList.add('status-dead');
        alert("👻 你已經死亡，天黑請勿睜眼"); 
    });

    socket.on('syncPotions', p => { witchPotions = p; });
    socket.on('gameMsg', m => alert(m));
    socket.on('gameOver', m => alert("🏁 遊戲結束！\n" + m));

    const sb=document.getElementById('showBtn'), rd=document.getElementById('roleDisplay');
    sb.onmousedown=sb.ontouchstart=(e)=>{ e.preventDefault(); rd.style.display="block"; };
    sb.onmouseup=sb.ontouchend=()=>{ rd.style.display="none"; };

    function changePhase(p){
        socket.emit('nextPhase',{roomCode:currentRoom, phase:p});
        if(p==='night') document.getElementById('adminLog').innerHTML = "紀錄：";
    }

    socket.on('phaseChanged', data => {
        const ov=document.getElementById('nightOverlay'), ui=document.getElementById('actionUI'), btns=document.getElementById('actionBtns');
        btns.innerHTML=""; ui.style.display="none";
        if(data.potions) witchPotions = data.potions;
        alivePlayers = data.alivePlayers;

        if(data.phase==='night'){
            if(!isHost) ov.style.display="flex"; 
            
            // 死者攔截：alive 為 false 則完全不顯示行動 UI
            if(alive && (myRole==='狼人'||myRole==='預言家'||myRole==='守衛')){
                ui.style.display="block";
                document.getElementById('actionMsg').innerText = "【"+myRole+"】請行動";
                data.alivePlayers.filter(p=>p!==myName).forEach(p=>{
                    if(myRole==='守衛' && p===lastGuardedByMe) return; // 守衛連守過濾
                    
                    const b = document.createElement('button'); b.innerText=p; b.style.background="#cf6679"; b.style.color="white";
                    b.onclick=()=>{
                        if(myRole==='預言家') socket.emit('checkRole',{roomCode:currentRoom, targetName:p});
                        else {
                            if(myRole==='守衛') lastGuardedByMe = p;
                            socket.emit(myRole==='狼人'?'wolfVote':'specialAction', {roomCode:currentRoom, target:p, type:'guarded'});
                            ov.style.display="none";
                        }
                    };
                    btns.appendChild(b);
                });
            }
        } else { ov.style.display="none"; }
    });

    socket.on('updateWitchInfo', d => {
        if(myRole==='女巫' && alive){
            const ov=document.getElementById('nightOverlay'), ui=document.getElementById('actionUI'), btns=document.getElementById('actionBtns');
            ov.style.display="flex"; ui.style.display="block"; btns.innerHTML="";
            document.getElementById('actionMsg').innerText = "昨晚死的是: " + (d.target || "無人");

            const b1 = document.createElement('button');
            b1.innerText = witchPotions.save ? "救人 (解藥)" : "解藥已用完";
            if(!witchPotions.save) b1.className = "btn-disabled";
            b1.onclick = () => { if(witchPotions.save){ socket.emit('specialAction',{roomCode:currentRoom, type:'saved', target:d.target}); ov.style.display="none"; }};

            const b2 = document.createElement('button');
            b2.innerText = witchPotions.poison ? "毒人 (毒藥)" : "毒藥已用完";
            if(!witchPotions.poison) b2.className = "btn-disabled";
            b2.onclick = () => {
                if(witchPotions.poison){
                    btns.innerHTML = "<p>毒殺誰？</p>";
                    alivePlayers.forEach(p => {
                        const b = document.createElement('button'); b.innerText=p;
                        b.onclick=()=>{ socket.emit('specialAction',{roomCode:currentRoom, type:'poisoned', target:p}); ov.style.display="none"; };
                        btns.appendChild(b);
                    });
                }
            };
            const b3 = document.createElement('button'); b3.innerText="不行動"; b3.style.background="#555"; b3.onclick=()=>ov.style.display="none";
            btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(b3);
        }
    });

    socket.on('checkResult', d => { alert(d.name + " 是 " + d.result); document.getElementById('nightOverlay').style.display="none"; });
    socket.on('adminLog', m => document.getElementById('adminLog').innerHTML += `<div>• ${m}</div>`);
</script>
</body>
</html>
